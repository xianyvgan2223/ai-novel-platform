server:
  port: ${PORT:3210}
  address: ${HOST:0.0.0.0}
  tomcat:
    # 导入 .db 时请求体可能很大，交给业务层自己限制体积
    max-swallow-size: -1

spring:
  application:
    name: deepseekapp-web-sync
  # 主存储：本机 MySQL（单库 + device_id 列做多设备隔离）
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:deepseekapp}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    # 密码不写在仓库文件里：放 web/server/.env 的 MYSQL_PASSWORD，或设置同名环境变量
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  servlet:
    multipart:
      max-file-size: ${RAG_MAX_UPLOAD:64MB}
      max-request-size: ${RAG_MAX_UPLOAD:64MB}
  # Spring AI：OpenAI 兼容协议对接 DeepSeek，密钥从 web/server/.env 读取
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.8
  mvc:
    throw-exception-if-no-handler-found: false
    async:
      # APK 有 100MB+，慢速局域网下下载可能超过 Servlet 默认的 30s 异步超时；
      # 这里放宽到 30 分钟，避免下载到一半被容器切断。
      request-timeout: 30m

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  charset:
    # 与 System.out 保持一致：Windows 控制台/IDE 都能正常显示中文
    console: ${stdout.encoding:UTF-8}

app:
  # 默认复用 Node 版的数据目录（web/server/data），升级后数据无缝可见
  data-dir: ${DATA_DIR:../server/data}
  # 前端构建产物（web/app/dist），存在时由本服务同源托管
  web-dist: ${WEB_DIST:../app/dist}
  # APK 发布目录；留空 = <data-dir>/app-update
  app-update-dir: ${APP_UPDATE_DIR:}
  # 后端启动后自动为已授权 USB 设备建立 adb reverse 隧道
  usb-auto: ${USB_AUTO:true}
  api-token: ${API_TOKEN:}
  max-upload-mb: ${MAX_UPLOAD_MB:512}
  default-page-size: ${PAGE_SIZE:50}
  max-page-size: ${MAX_PAGE_SIZE:500}
  web-device-id: ${WEB_DEVICE_ID:web-console}
  web-id-base: ${WEB_ID_BASE:1000000000}
  # 首次启动时把 data/devices 下的旧 SQLite 数据导入 MySQL，完成后写 app_meta 标记，不会重复执行
  migrate-sqlite: ${MIGRATE_SQLITE:true}
  # ── AI 写作 ──
  # 密钥优先读这里（环境变量）；留空时会自动读取 web/server/.env 里的 DEEPSEEK_API_KEY
  deepseek-api-key: ${DEEPSEEK_API_KEY:}
  deepseek-base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  deepseek-model: ${DEEPSEEK_MODEL:deepseek-chat}
  ai-timeout-ms: ${AI_TIMEOUT_MS:180000}
  # ── B站视频转写 ──
  # faster-whisper 的 Python 解释器；模型默认 small；超长视频拒绝本地转写
  bili-python: ${BILI_PYTHON:D:\tools\python3.10.10\python.exe}
  bili-whisper-model: ${BILI_WHISPER_MODEL:small}
  bili-max-video-minutes: ${BILI_MAX_VIDEO_MINUTES:180}
  # ── RAG 情节素材库（Elasticsearch + 阿里百炼 embedding + DeepSeek）──
  rag-es-url: ${RAG_ES_URL:http://127.0.0.1:9221}
  rag-es-index: ${RAG_ES_INDEX:novel_rag_scenes}
  dashscope-api-key: ${DASHSCOPE_API_KEY:}
  dashscope-base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
  embedding-dim: ${DASHSCOPE_EMBEDDING_DIM:1024}
  rag-chunk-chars: ${RAG_CHUNK_CHARS:8000}
