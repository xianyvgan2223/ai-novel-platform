server:
  port: ${PORT:3210}
  address: ${HOST:0.0.0.0}
  tomcat:
    # 导入 .db 时请求体可能很大，交给业务层自己限制体积
    max-swallow-size: -1

spring:
  application:
    name: deepseekapp-web-sync
  # Spring AI：OpenAI 兼容协议对接 DeepSeek，密钥从 web/server/.env 读取
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.8
  mvc:
    throw-exception-if-no-handler-found: false
    async:
      # APK 有 100MB+，慢速局域网下下载可能超过 Servlet 默认的 30s 异步超时；
      # 这里放宽到 30 分钟，避免下载到一半被容器切断。
      request-timeout: 30m

logging:
  charset:
    # 与 System.out 保持一致：Windows 控制台/IDE 都能正常显示中文
    console: ${stdout.encoding:UTF-8}

app:
  # 默认复用 Node 版的数据目录（web/server/data），升级后数据无缝可见
  data-dir: ${DATA_DIR:../server/data}
  # 前端构建产物（web/app/dist），存在时由本服务同源托管
  web-dist: ${WEB_DIST:../app/dist}
  # APK 发布目录；留空 = <data-dir>/app-update
  app-update-dir: ${APP_UPDATE_DIR:}
  # 后端启动后自动为已授权 USB 设备建立 adb reverse 隧道
  usb-auto: ${USB_AUTO:true}
  api-token: ${API_TOKEN:}
  max-upload-mb: ${MAX_UPLOAD_MB:512}
  default-page-size: ${PAGE_SIZE:50}
  max-page-size: ${MAX_PAGE_SIZE:500}
  web-device-id: ${WEB_DEVICE_ID:web-console}
  web-id-base: ${WEB_ID_BASE:1000000000}
  # ── AI 写作 ──
  # 密钥优先读这里（环境变量）；留空时会自动读取 web/server/.env 里的 DEEPSEEK_API_KEY
  deepseek-api-key: ${DEEPSEEK_API_KEY:}
  deepseek-base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  deepseek-model: ${DEEPSEEK_MODEL:deepseek-chat}
  ai-timeout-ms: ${AI_TIMEOUT_MS:180000}
